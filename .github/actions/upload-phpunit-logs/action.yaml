name: 'Upload PHPUnit logs'
description: 'Upload PHPUnit logs with a consistent artifact name'

inputs:
  coverage:
    required: false
    default: 'false'
    description: Whether to upload the coverage results to Coveralls
  database:
    required: true
    description: Database being used
  dependencies:
    required: true
    description: Dependencies being used
  php:
    required: true
    description: PHP Version being used

runs:
  using: 'composite'
  steps:
    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        # the artifact name must be unique within the workflow run
        name: phpunit-logs-${{ inputs.php }}-${{ inputs.database }}-${{ inputs.dependencies }}
        path: build/logs/phpunit
      continue-on-error: true

    - name: Upload coverage results to Coveralls
      if: inputs.coverage == 'true'
      env:
        COVERALLS_REPO_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        composer global require --prefer-dist --no-interaction --no-progress --ansi \
          php-coveralls/php-coveralls
        php-coveralls --coverage_clover=build/logs/phpunit/clover.xml -v
      continue-on-error: true
